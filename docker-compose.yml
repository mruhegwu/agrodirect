services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agrodirect_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=agrodirect-production-secret-key-2026
    volumes:
      - agrodirect_data:/app/data

volumes:
  agrodirect_data:
    driver: local
